services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - nailshop-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:?AUTH_COOKIE_SECURE is required}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:?AUTH_TRUST_HOST is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      NODE_ENV: ${NODE_ENV:-production}
      HOSTNAME: 0.0.0.0
      SHOP_TIMEZONE: ${SHOP_TIMEZONE:?SHOP_TIMEZONE is required}
      SHOP_CURRENCY: ${SHOP_CURRENCY:?SHOP_CURRENCY is required}
      SHOP_CLOSING_TIME: ${SHOP_CLOSING_TIME:?SHOP_CLOSING_TIME is required}
      VERIFIED_SESSION_TTL_MINUTES: ${VERIFIED_SESSION_TTL_MINUTES:?VERIFIED_SESSION_TTL_MINUTES is required}
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    command: ["node", "server.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: migrator
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      STATION_EMAIL: ${STATION_EMAIL:?STATION_EMAIL is required}
      STATION_PASSWORD: ${STATION_PASSWORD:?STATION_PASSWORD is required}
      STAFF_DEFAULT_PIN: ${STAFF_DEFAULT_PIN:?STAFF_DEFAULT_PIN is required}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && npm run db:seed"]

  nginx:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  nailshop-postgres:
