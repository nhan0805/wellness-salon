events {}

http {
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=kiosk_limit:10m rate=5r/s;

  upstream nail_shop_app { server app:3000; }

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/kiosk/ {
      limit_req zone=kiosk_limit burst=10 nodelay;
      proxy_pass http://nail_shop_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_pass http://nail_shop_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/sse/ {
      proxy_pass http://nail_shop_app;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://nail_shop_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # Production TLS: add a second server block with listen 443 ssl and mount
  # operator-provided cert.pem/key.pem. The certificates are intentionally a human gate.
}
