name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-only-32-byte-random-value-replace-me
      AUTH_COOKIE_SECURE: 'false'
      AUTH_TRUST_HOST: 'true'
      NEXTAUTH_URL: http://127.0.0.1:3000
      CRON_SECRET: ci-only-cron-secret
      SHOP_TIMEZONE: Asia/Ho_Chi_Minh
      ADMIN_EMAIL: admin@ci.invalid
      ADMIN_PASSWORD: ci-only-admin-password
      STATION_EMAIL: station@ci.invalid
      STATION_PASSWORD: ci-only-station-password
      STAFF_DEFAULT_PIN: '1234'
      D1_TEST_PERSIST_TO: .d1-test-state
      D1_TEST_ADMIN_EMAIL: d1-admin@ci.invalid
      D1_TEST_ADMIN_PASSWORD: d1-ci-admin-password
      D1_TEST_STATION_EMAIL: d1-station@ci.invalid
      D1_TEST_STATION_PASSWORD: d1-ci-station-password
      D1_TEST_STAFF_PIN: '1234'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --omit=dev --omit=optional --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:d1

  deploy-production:
    name: Deploy wellness Worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://wellness.n8l.workers.dev
    concurrency:
      group: wellness-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run deploy:vinext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
